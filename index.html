<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TGL Agent Finder</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft JhengHei', sans-serif;
    background: #f5f7fa; color: #1a2340; min-height: 100vh; padding: 18px 14px 60px;
  }
  .wrap { max-width: 1080px; margin: 0 auto; }
  .header { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
  .logo { background: #003087; color: #fff; font-weight: 900; font-size: 17px;
    padding: 8px 13px; border-radius: 8px; letter-spacing: 1px; }
  h1 { font-size: 20px; font-weight: 700; color: #003087; }
  .subtitle { font-size: 12px; color: #888; margin-top: 2px; }

  .panel { background: #fff; border-radius: 12px; padding: 16px 18px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.07); margin-bottom: 14px; }
  label { display: block; font-size: 11px; font-weight: 700; color: #555;
    margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }

  #q { width: 100%; padding: 12px 15px; font-size: 16px; border: 2px solid #e0e4ef;
    border-radius: 8px; outline: none; background: #fafbfd; transition: border-color .2s; }
  #q:focus { border-color: #003087; background: #fff; }
  .hint { font-size: 11.5px; color: #999; margin-top: 7px; }
  .hint b { color: #003087; }

  .filters { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
  .filters select { flex: 1 1 160px; min-width: 140px; padding: 9px 11px; font-size: 13px;
    border: 2px solid #e0e4ef; border-radius: 8px; background: #fafbfd; color: #1a2340; outline: none; }
  .filters select:focus { border-color: #003087; }

  .caps { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  .chip { font-size: 12.5px; padding: 7px 12px; border-radius: 20px; cursor: pointer;
    border: 2px solid #e0e4ef; background: #fafbfd; color: #444; user-select: none;
    transition: all .15s; font-weight: 600; }
  .chip:hover { border-color: #b9c2dd; }
  .chip.on { background: #003087; border-color: #003087; color: #fff; }

  .toolbar { display: flex; justify-content: space-between; align-items: center;
    margin: 4px 2px 12px; flex-wrap: wrap; gap: 8px; }
  .count { font-size: 13px; color: #555; font-weight: 600; }
  .count b { color: #003087; }
  .clear { font-size: 12px; color: #c0392b; background: none; border: none; cursor: pointer;
    font-weight: 600; padding: 4px 8px; }
  .clear:hover { text-decoration: underline; }

  .card { background: #fff; border-radius: 12px; padding: 15px 17px; margin-bottom: 11px;
    box-shadow: 0 1px 5px rgba(0,0,0,0.06); border-left: 4px solid #003087; }
  .card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px;
    flex-wrap: wrap; }
  .co { font-size: 16px; font-weight: 700; color: #1a2340; }
  .loc { font-size: 12.5px; color: #777; margin-top: 2px; }
  .loc .flag { color: #003087; font-weight: 600; }
  .badges { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
  .badge { font-size: 10.5px; font-weight: 700; padding: 3px 8px; border-radius: 12px;
    background: #eef1f8; color: #003087; }
  .badge.region { background: #003087; color: #fff; }
  .badge.net { background: #e8f4ec; color: #1e7e45; }

  .capline { display: flex; flex-wrap: wrap; gap: 5px; margin: 10px 0 4px; }
  .capbadge { font-size: 11px; font-weight: 600; padding: 4px 9px; border-radius: 6px;
    background: #fff4e6; color: #b9660b; border: 1px solid #ffe0b8; }

  .contacts { margin-top: 10px; border-top: 1px solid #f0f2f7; padding-top: 9px; }
  .contact { font-size: 13px; padding: 3px 0; display: flex; flex-wrap: wrap; gap: 5px 12px; align-items: baseline; }
  .contact .nm { font-weight: 600; color: #1a2340; }
  .contact .ti { color: #888; font-size: 11.5px; }
  .contact a { color: #0057c8; text-decoration: none; }
  .contact a:hover { text-decoration: underline; }
  .contact .tel { color: #555; font-size: 12px; }

  .extra { margin-top: 9px; font-size: 12px; color: #555; line-height: 1.5; }
  .extra .k { font-weight: 700; color: #003087; }
  .weblink { font-size: 12px; margin-top: 7px; }
  .weblink a { color: #0057c8; text-decoration: none; }

  .empty { text-align: center; color: #999; padding: 40px 10px; font-size: 14px; }
  mark { background: #fff3a0; padding: 0 1px; border-radius: 2px; }
  @media (max-width: 560px){ .co{font-size:15px;} #q{font-size:15px;} }

  /* --- shared passcode gate --- */
  #gate { position: fixed; inset: 0; background: #f5f7fa; z-index: 9999;
    display: flex; align-items: center; justify-content: center; padding: 20px; }
  .gate-box { background: #fff; border-radius: 14px; padding: 30px 26px;
    box-shadow: 0 6px 26px rgba(0,0,0,0.12); width: 100%; max-width: 340px; text-align: center; }
  .gate-box .logo { display: inline-block; margin-bottom: 14px; }
  .gate-box h2 { font-size: 16px; color: #003087; margin-bottom: 4px; }
  .gate-box p { font-size: 12px; color: #999; margin-bottom: 16px; }
  #pc { width: 100%; padding: 11px 13px; font-size: 15px; text-align: center;
    border: 2px solid #e0e4ef; border-radius: 8px; outline: none; background: #fafbfd; }
  #pc:focus { border-color: #003087; }
  #gate button { margin-top: 12px; width: 100%; padding: 11px; font-size: 14px; font-weight: 700;
    color: #fff; background: #003087; border: none; border-radius: 8px; cursor: pointer; }
  #gate button:hover { background: #00246a; }
  .gate-err { color: #c0392b; font-size: 12px; margin-top: 10px; min-height: 16px; }
</style>
</head>
<body>
<!-- shared passcode gate (light access screen; not strong security) -->
<div id="gate">
  <div class="gate-box">
    <div class="logo" style="background:#003087;color:#fff;font-weight:900;font-size:17px;padding:8px 13px;border-radius:8px;letter-spacing:1px;">TGL</div>
    <h2>Agent Finder</h2>
    <p>Internal tool — enter the shared passcode to continue.</p>
    <input id="pc" type="password" placeholder="Passcode" autocomplete="off" autofocus>
    <button id="pcBtn">Enter</button>
    <div class="gate-err" id="pcErr"></div>
  </div>
</div>

<div class="wrap">
  <div class="header">
    <div class="logo">TGL</div>
    <div>
      <h1>Agent Finder</h1>
      <div class="subtitle">Find the right overseas agent for an inquiry — by country / city / service capability · Internal use</div>
    </div>
  </div>

  <div class="panel">
    <label>Search (company, country, city, contact, email, strengths…)</label>
    <input id="q" type="text" placeholder="e.g. Los Angeles, reefer, Vietnam, customs…  separate words with spaces (all must match)" autocomplete="off">
    <div class="hint">💡 Looking for an agent <b>with a warehouse in LA</b>? Type <b>Los Angeles</b>, then click the <b>🏭 Warehouse</b> chip below.</div>

    <div class="filters">
      <div style="flex:1 1 150px;">
        <label>Region</label>
        <select id="fCat"><option value="">All regions</option></select>
      </div>
      <div style="flex:1 1 150px;">
        <label>Country</label>
        <select id="fCountry"><option value="">All countries</option></select>
      </div>
      <div style="flex:1 1 150px;">
        <label>City</label>
        <select id="fCity"><option value="">All cities</option></select>
      </div>
      <div style="flex:1 1 150px;">
        <label>IATA Code</label>
        <select id="fCode"><option value="">All codes</option></select>
      </div>
      <div style="flex:1 1 150px;">
        <label>Network</label>
        <select id="fNet"><option value="">All networks</option></select>
      </div>
    </div>

    <label style="margin-top:14px;">Service capability (click = show only agents that have it)</label>
    <div class="caps" id="caps"></div>
  </div>

  <div class="toolbar">
    <div class="count" id="count"></div>
    <button class="clear" id="clear">✕ Clear all filters</button>
  </div>

  <div id="results"></div>
</div>

<script>
// ---- shared passcode gate (light gate; data is embedded, so not strong security) ----
(function(){
  const PASSCODE = 'tgl16598004';
  const KEY = 'tgl_af_ok';
  const gate = document.getElementById('gate');
  function unlock(){ gate.style.display='none'; document.getElementById('q').focus(); }
  function tryOpen(){
    const v = document.getElementById('pc').value.trim();
    if(v === PASSCODE){ try{ localStorage.setItem(KEY, PASSCODE); }catch(e){} unlock(); }
    else { document.getElementById('pcErr').textContent = 'Incorrect passcode.'; }
  }
  try{ if(localStorage.getItem(KEY) === PASSCODE){ gate.style.display='none'; } }catch(e){}
  document.getElementById('pcBtn').addEventListener('click', tryOpen);
  document.getElementById('pc').addEventListener('keydown', e=>{ if(e.key==='Enter') tryOpen(); });
})();

// ---- normalize noisy source values (case variants / junk) ----
const NET_CANON = {  // uppercased variant -> canonical display
  'BLOC':'Bloc','AIO':'AiO','AIO LOGISTICS NETWORK':'AiO','AIO PERISHABLE':'AiO',
  'SEAJET':'SEAJET','LINKBRIDGE ( SEAJET)':'SEAJET',
  'SLN':'SLN','5SLN':'SLN','5-SLN':'SLN','SEAHAWK LOGISTICS NETWORK (SLN)':'SLN',
  'JCTRANS':'JCtrans','JC TRANS':'JCtrans',
  'WCA':'WCA','WCA (NETWORK PARTNER)':'WCA','WCA (PARTNER)':'WCA','WCA INTER GLOBAL':'WCA',
  'GFP':'GFP','GFP (GLOBAL FORWARDING PARTNERS)':'GFP',
  'PCN':'PCN','PCN (PROJECT CARGO NETWORK)':'PCN',
  'THE COOPERATIVE LOGISTICS NETWORK':'The Coop','THE COOPERATIVE LOGISTICS NETWORK (THE COOP)':'The Coop','COOP':'The Coop',
  'X2 ELITE':'X2 Elite','ELITE':'X2 Elite',
  'FRYET':'Freyt World',
  'OLO FAMILY':'OLO',
  'INDEPENDENT (MWG PROPRIETARY NETWORK)':'Independent',
};
// values that are certifications / noise, not real networks -> drop from Network filter
const NET_DROP = new Set(['-','A','N','NA','AI','AI AGENT','AEO','IATA','FIATA','ISO 9001',
  'FMCSA','FMCSA AUTHORIZED','LINKEDIN','GLOBAL','GLOBAL NETWORK','USA','NORTH AMERICA','NYSE: RLGT',
  'TRANSPORT TOPICS TOP 25','TSA','WIFFA','TIA MEMBER (ID: 156095)','']);
function canonNet(s){ if(!s) return ''; const u=s.trim().toUpperCase();
  if(NET_DROP.has(u)) return ''; return NET_CANON[u] || s.trim(); }
function canonCountry(s){ if(!s) return ''; s=s.trim();
  if(/^[A-Z][A-Z .]+$/.test(s) && /[A-Z]{4,}/.test(s)) // all-caps word len>=4 -> Title Case
    return s.toLowerCase().replace(/\b\w/g,m=>m.toUpperCase());
  return s; }
const _US_STATE_RE = new RegExp('\\s+(?:Alabama|Alaska|Arizona|Arkansas|California|Colorado|Connecticut|Delaware|Florida|Georgia|Hawaii|Idaho|Illinois|Indiana|Iowa|Kansas|Kentucky|Louisiana|Maine|Maryland|Massachusetts|Michigan|Minnesota|Mississippi|Missouri|Montana|Nebraska|Nevada|New Hampshire|New Jersey|New Mexico|New York|North Carolina|North Dakota|Ohio|Oklahoma|Oregon|Pennsylvania|Rhode Island|South Carolina|South Dakota|Tennessee|Texas|Utah|Vermont|Virginia|Washington|West Virginia|Wisconsin|Wyoming)$', 'i');
function canonCity(s){ s=(s||'').replace(/\s+/g,' ').trim(); if(!s) return '';
  s=s.split(',')[0].trim();          // drop ", CA" / ", Country" qualifier
  s=s.replace(_US_STATE_RE,'').trim(); // drop trailing spelled-out US state ("Los Angeles California" -> "Los Angeles")
  if(/^[A-Z][A-Z .'-]+$/.test(s)) s=s.toLowerCase().replace(/\b\w/g,m=>m.toUpperCase()); // ALLCAPS -> Title Case
  return s; }
function junkCode(s){ return /^(?:-+|n\/?a|tbd|none|\?+|\.+)$/i.test((s||'').trim()); }

DATA.forEach(d => {
  d.country = canonCountry(d.country);
  d.city = canonCity(d.city);
  d.code = (d.code||'').trim(); if(junkCode(d.code)) d.code='';
  d.netCanon = [...new Set(d.networks.map(canonNet).filter(Boolean))];
  d._s = [d.company, d.country, d.city, d.code, d.cat, d.networks.join(' '),
    d.strength, d.activities, d.special, d.note, d.addr,
    d.contacts.map(c=>c.name+' '+c.title+' '+c.email).join(' ')
  ].join(' ').toLowerCase();
});

const $ = id => document.getElementById(id);
const state = { q:'', cat:'', country:'', city:'', code:'', net:'', caps:new Set() };

// ---- faceted (cascading) dropdowns ----
// each dropdown's options reflect what's available under the OTHER active filters
const FACETS = [
  {key:'cat',     sel:'fCat',     all:'All regions',   vals:d=>[d.cat]},
  {key:'country', sel:'fCountry', all:'All countries', vals:d=>[d.country]},
  {key:'city',    sel:'fCity',    all:'All cities',    vals:d=>[d.city]},
  {key:'code',    sel:'fCode',    all:'All codes',     vals:d=>[d.code]},
  {key:'net',     sel:'fNet',     all:'All networks',  vals:d=>d.netCanon, min:2},
];
function matchesExcept(d, except){
  const terms = state.q ? state.q.split(/\s+/).filter(Boolean) : [];
  if(except!=='cat'     && state.cat     && d.cat!==state.cat) return false;
  if(except!=='country' && state.country && d.country!==state.country) return false;
  if(except!=='city'    && state.city    && d.city!==state.city) return false;
  if(except!=='code'    && state.code    && d.code!==state.code) return false;
  if(except!=='net'     && state.net     && !d.netCanon.includes(state.net)) return false;
  for(const k of state.caps) if(!d.caps[k]) return false;
  for(const t of terms) if(!d._s.includes(t)) return false;
  return true;
}
const matches = d => matchesExcept(d, null);

function rebuildFacet(f){
  const sel=$(f.sel), cur=state[f.key], counts={};
  DATA.forEach(d=>{ if(matchesExcept(d,f.key)) f.vals(d).forEach(v=>{ if(v) counts[v]=(counts[v]||0)+1; }); });
  let opts=Object.keys(counts);
  if(f.min) opts=opts.filter(v=>counts[v]>=f.min || v===cur);
  if(cur && !opts.includes(cur)) opts.push(cur);
  opts.sort((a,b)=>a.localeCompare(b));
  sel.innerHTML = `<option value="">${f.all}</option>` +
    opts.map(v=>`<option value="${esc(v)}"${v===cur?' selected':''}>${esc(v)}</option>`).join('');
}
function rebuildFacets(){ FACETS.forEach(rebuildFacet); }
FACETS.forEach(f=>{ $(f.sel).onchange = e=>{ state[f.key]=e.target.value; rebuildFacets(); render(); }; });
rebuildFacets();

// capability chips
const capsBox=$('caps');
CAP_DEFS.forEach(([k,lbl])=>{
  const c=document.createElement('div'); c.className='chip'; c.textContent=lbl; c.dataset.k=k;
  c.onclick=()=>{ if(state.caps.has(k)){state.caps.delete(k);c.classList.remove('on');}
    else{state.caps.add(k);c.classList.add('on');} rebuildFacets(); render(); };
  capsBox.appendChild(c);
});

$('q').addEventListener('input', e=>{ state.q=e.target.value.trim().toLowerCase(); rebuildFacets(); render(); });
$('clear').onclick=()=>{
  state.q='';state.cat='';state.country='';state.city='';state.code='';state.net='';state.caps.clear();
  $('q').value='';
  document.querySelectorAll('.chip.on').forEach(c=>c.classList.remove('on'));
  rebuildFacets(); render();
};

function esc(s){ return (s||'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m])); }
function hl(s, terms){ s=esc(s); terms.forEach(t=>{ if(t.length<2)return;
  const re=new RegExp('('+t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi');
  s=s.replace(re,'<mark>$1</mark>'); }); return s; }

const CAP_LABEL=Object.fromEntries(CAP_DEFS.map(([k,l])=>[k,l]));
function capBadge(k,raw){ let t=CAP_LABEL[k]; if(raw) t+=' — '+raw; return `<span class="capbadge">${esc(t)}</span>`; }

function render(){
  const terms = state.q ? state.q.split(/\s+/).filter(Boolean) : [];
  const res = DATA.filter(matches);
  $('count').innerHTML = `Found <b>${res.length}</b> agent${res.length===1?'':'s'}` + (DATA.length!==res.length?` <span style="color:#aaa">(of ${DATA.length})</span>`:'');
  const box=$('results');
  if(!res.length){ box.innerHTML='<div class="empty">No agents match — try broadening the filters or different keywords.</div>'; return; }
  const CAP=250;
  const html = res.slice(0,CAP).map(d=>{
    const nets = d.netCanon.map(n=>`<span class="badge net">${esc(n)}</span>`).join('');
    const caps = Object.keys(d.caps).map(k=>capBadge(k, d.capraw&&d.capraw[k])).join('');
    const contacts = d.contacts.map(c=>{
      let parts=[`<span class="nm">${hl(c.name,terms)}</span>`];
      if(c.title) parts.push(`<span class="ti">${esc(c.title)}</span>`);
      if(c.email) parts.push(`<a href="mailto:${esc(c.email)}">✉ ${esc(c.email)}</a>`);
      if(c.tel){ const tel=c.tel.replace(/\s+/g,' ').trim(); parts.push(`<span class="tel">📞 ${esc(tel)}</span>`); }
      return `<div class="contact">${parts.join('')}</div>`;
    }).join('');
    let extra='';
    if(d.strength) extra+=`<div class="extra"><span class="k">Strength: </span>${hl(d.strength,terms)}</div>`;
    if(d.special) extra+=`<div class="extra"><span class="k">Special service: </span>${hl(d.special,terms)}</div>`;
    const web = d.web ? `<div class="weblink">🔗 <a href="${d.web.startsWith('http')?esc(d.web):'https://'+esc(d.web)}" target="_blank" rel="noopener">${esc(d.web)}</a></div>` : '';
    const loc = [d.city, d.country].filter(Boolean).map(esc).join(', ');
    return `<div class="card">
      <div class="card-top">
        <div>
          <div class="co">${hl(d.company,terms)}</div>
          <div class="loc"><span class="flag">📍 ${loc||'—'}</span>${d.code?' · '+esc(d.code):''}</div>
        </div>
        <div class="badges">${d.cat?`<span class="badge region">${esc(d.cat)}</span>`:''}${nets}</div>
      </div>
      ${caps?`<div class="capline">${caps}</div>`:''}
      ${contacts?`<div class="contacts">${contacts}</div>`:''}
      ${extra}${web}
    </div>`;
  }).join('');
  const more = res.length>CAP ? `<div class="empty">Showing the first ${CAP} of ${res.length} matches — narrow your search.</div>`:'';
  box.innerHTML = html + more;
}
render();
</script>
</body>
</html>
